[package]
name = "psymd-core"
description = "File handling, watching and Markdown rendering for psy.md"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
ammonia = "4.2.4"
comrak = { version = "0.59.0", default-features = false }
notify = "8.2.2"
percent-encoding = "2.3.2"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
url = "2.5.8"

[dev-dependencies]
serde_json = "1.0.154"
tempfile = "3.27.0"
